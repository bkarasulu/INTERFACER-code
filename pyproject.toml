[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interfacer"
dynamic = ["version"]
description = "Build and analyse solid-solid interfaces from two bulk structures (VASP, CASTEP and ASE calculators)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Huseyin Sener Sen" }, { name = "Bora Karasulu" }]
keywords = ["interfaces", "surfaces", "DFT", "VASP", "CASTEP", "ASE", "machine-learning potentials", "batteries"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy",
    "matplotlib",
    "ase>=3.23",
    "spglib>=2.0",
    "pymatgen>=2023.1",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest", "pyyaml"]
yaml = ["pyyaml"]
docs = ["mkdocs-material", "mkdocstrings[python]"]
lint = ["ruff"]
# machine-learning potentials (-prog mlip --mlip <name>); install the ones you need
mace = ["mace-torch"]
chgnet = ["chgnet"]
matgl = ["matgl"]
sevennet = ["sevenn"]
orb = ["orb-models"]
fairchem = ["fairchem-core"]
nequip = ["nequip"]
allegro = ["nequip-allegro"]

[project.urls]
Homepage = "https://github.com/bkarasulu/INTERFACER-code"
Documentation = "https://interfacer.readthedocs.io"
Issues = "https://github.com/bkarasulu/INTERFACER-code/issues"

[project.scripts]
interfacer = "interfacer.cli:main"

[tool.setuptools.dynamic]
version = { attr = "interfacer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
extend-exclude = ["Tutorials/*/BKP", "site"]

[tool.ruff.lint]
# pyflakes-level checks (undefined names, unused imports/variables, syntax) plus a few error-prone patterns;
# the legacy modules keep their original formatting
select = ["F", "E9", "B006", "B008"]
ignore = ["F403", "F405", "F841", "E741"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["F401"]
"src/interfacer/external.py" = ["F401"]
"src/interfacer/__init__.py" = ["F401"]
